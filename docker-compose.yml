# One service per experiment configuration in configs/.
# The dataset is mounted read-only; results are written to ./data on the host.
x-experiment: &experiment
  build: .
  image: davidedomini99/experiments-2026-jbhi-dtas-for-fl:${VERSION:-latest}
  volumes:
    - ./T1DiabetesGranada:/experiment/T1DiabetesGranada:ro
    - ./data:/experiment/data

services:

  adwin-fedpers-noniid:
    <<: *experiment
    command: poetry run python3 src/main.py --config configs/adwin-fedpers-noniid.toml

  adwin-federated-noniid:
    <<: *experiment
    command: poetry run python3 src/main.py --config configs/adwin-federated-noniid.toml

  adwin-lowdata-fedpers:
    <<: *experiment
    command: poetry run python3 src/main.py --config configs/adwin-lowdata-fedpers.toml

  adwin-lowdata-local:
    <<: *experiment
    command: poetry run python3 src/main.py --config configs/adwin-lowdata-local.toml
