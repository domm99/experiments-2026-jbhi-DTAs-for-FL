# Quantity skew: two hospitals reduced to 5 patients (the others receive the
# remaining patients). Federated learning with personalization.
# NOTE: iid = true reproduces the previous experiments (folders "-IID"); set it
# to false for quantity skew on top of the label-skew partitioning.
experiment = "ADWINErrorHierarchicalRetrainingPolicy"
seeds = [0, 1, 2, 3, 4]
iid = true
hospital_patient_caps = { Hospital-0 = 5, Hospital-1 = 5 }
only_local_learning = false
personalization = true
personalization_epochs = 3
mu = 0.7
fl_global_rounds = 8
fl_local_epochs = 3

adwin_delta = 0.1
adwin_inference_interval_days = 1
adwin_drifted_dt_fraction_threshold = 0.2   # p
adwin_drifted_dta_fraction_threshold = 0.3  # q
adwin_min_evaluated_dts = 5
