# Quantity skew, purely local baseline: every DTA trains only on its own data,
# with the same per-retraining budget as the federated strategy
# (local_epochs = fl_global_rounds * fl_local_epochs + personalization_epochs),
# and retrains when its own quorum p is reached.
# NOTE: keep iid consistent with adwin-lowdata-fedpers.toml.
experiment = "ADWINErrorHierarchicalRetrainingPolicy"
seeds = [0, 1, 2, 3, 4]
iid = true
hospital_patient_caps = { Hospital-0 = 5, Hospital-1 = 5 }
only_local_learning = true
local_retrain_trigger = "dta"
local_mu = 0.0
fl_global_rounds = 8
fl_local_epochs = 3
personalization_epochs = 3

adwin_delta = 0.1
adwin_inference_interval_days = 1
adwin_drifted_dt_fraction_threshold = 0.2   # p
adwin_min_evaluated_dts = 5
